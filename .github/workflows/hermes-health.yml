name: Hermes Health Check
on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 min
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check HF Space (warn-only, space offline since 2026-08-22)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://leofalco-hermes-agent-cloud.hf.space/health)
          echo "HF Space: $CODE (informational only)"
      - name: Check Telegram Bot (primary gateway)
        run: |
          RESP=$(curl -s https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/getMe)
          echo "TG: $(echo $RESP | grep -o '"username":"[^"]*"')"
          if echo "$RESP" | grep -q '"ok":true'; then echo "OK"; else exit 1; fi
